<style>

.gs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;padding:0 7%;scroll-padding:0 7%;scrollbar-width:none}.gs::-webkit-scrollbar{display:none}

.gcap{max-width:520px;text-align:center;padding:0 16px;font-size:20px}.gcap b{font-family:var(--hand);font-size:30px}.gcap p{color:var(--dim);margin:4px 0 0;font-size:17px}
.pics{flex-basis:100%;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.th{position:relative}.th img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:2px solid var(--dim);display:block}.th.cv img{border-color:var(--chalk)}.th .tb{border:0;padding:0;background:none}.th button:not(.tb){position:absolute;top:-8px;right:-8px;width:22px;height:22px;padding:0;font-size:12px;border-radius:50%;background:var(--board)}
.addp{border:2px dashed var(--chalk);border-radius:10px;padding:6px 12px;cursor:pointer}.addp input{display:none}
.lib input.e:disabled{opacity:.3}

.stile .si{font-size:30px;line-height:1.1}.stile .sth{width:40px;height:40px;object-fit:cover;border-radius:8px}.stile .sn{font-family:var(--hand);font-size:22px;font-weight:700;line-height:1;text-align:center}.stile .sp{color:var(--dim);font-size:16px}
.stile b{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;border-radius:12px;background:var(--chalk);color:var(--board);font-size:15px;line-height:24px;text-align:center;padding:0 5px}
.stot{font-size:20px;margin:6px 0}.stot b{font-family:var(--hand);font-size:46px}.stot span{color:var(--dim)}
.srow{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted #4a5051}
.sdt{color:var(--dim);font-size:15px;min-width:92px}.sa{width:84px}
details summary{cursor:pointer;margin-bottom:6px}
.sec{display:flex;gap:6px;align-items:flex-end}

.sec button.big{flex:2;font-size:40px}
@media (max-width:560px){.sec button{font-size:20px}.sec button.big{font-size:28px}}
.sec button.big{background:#000;border-color:var(--chalk);padding:0;overflow:hidden}.sec button.big.on{background:#000;color:inherit;border-color:var(--kit);box-shadow:0 0 0 2px var(--kit)}
.tl{width:100%;height:auto;max-height:150px;object-fit:contain;display:block;margin:0 auto}
.bc{background:#000}.bc .lg{width:min(72%,240px);margin:0 auto 4px;display:block}
.bcw{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin:6px 0 14px}
.bc.back{align-items:center;justify-content:center;text-align:center;gap:10px}.bl1{font-family:var(--hand);font-size:36px;font-weight:700;line-height:1.05}.bl2{font-family:var(--hand);font-size:30px;font-weight:700;color:var(--kit);line-height:1.1}
.gv{overflow-y:auto}
.np{font-size:16px;color:var(--dim);font-weight:400}
.rpb{display:flex;flex-direction:column;align-items:center;gap:0;margin-top:2px}
.rr{font-family:var(--hand);font-size:36px;font-weight:700;color:var(--kit);line-height:1;transform:rotate(-2deg);display:inline-block}
.lib select.lk{width:140px}.lib input.p.rp2{width:86px}
.mv{display:flex;gap:4px;flex:none}.mv button{width:38px;height:38px;padding:0}
.bc{border:3px dashed var(--chalk);border-radius:16px 12px 18px 11px;background:var(--board2);padding:22px 26px;width:min(86vw,420px);display:flex;flex-direction:column;gap:6px;font-size:22px}
.bc .bn{font-family:var(--hand);font-size:44px;font-weight:700;line-height:1}.bc .bb{font-family:var(--hand);font-size:30px;font-weight:700;color:var(--kit);margin-bottom:6px}.bc a{color:var(--chalk);text-decoration:none}

.lib{gap:6px;padding-top:6px;padding-bottom:6px}.lib input.e{width:50px;padding:5px 4px}.lib input.n{width:150px}.lib input.p{width:64px}.lib select{width:122px}
.lib input.o{flex:1;min-width:0;width:auto}
.pbtn{position:relative;width:48px;height:42px;padding:0;overflow:hidden;font-size:20px;flex:none}.pbtn img{width:100%;height:100%;object-fit:cover;display:block}.pbtn b{position:absolute;right:2px;bottom:2px;background:var(--chalk);color:var(--board);border-radius:9px;font-size:13px;padding:0 5px;line-height:1.3}
.lib>button[data-a=rm]{flex:none;width:42px;padding:4px 0}
@media (min-width:640px){.lib{flex-wrap:nowrap}}
.ds{font-size:16px;color:var(--dim);line-height:1.2;margin-top:4px}
.gh{grid-column:1/-1;font-family:var(--hand);font-size:28px;font-weight:700;color:var(--c);margin:8px 0 -6px;border-bottom:2px dashed var(--c);line-height:1.1}
.pres .fh{font-family:var(--hand);font-size:30px;margin:0}.pres h1{margin:0 0 4px}.pres .card{min-height:170px}
.lock{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));opacity:.3;border-radius:50%;width:44px;height:44px;padding:0;font-size:20px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:20px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}}

<body>
<header><h1>Enfuego card maker</h1><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const KEY='enfuego-menu-v1';
const TIERS={kit:'Available Today',home:'Ready To Ship',order:'Made To Order'};
const CATS={fire:'Fire props',acc:'Accessories',life:'Lifestyle'};
const ORD=['fire','acc','life'];
const sortC=a=>a.slice().sort((x,y)=>ORD.indexOf(x.cat)-ORD.indexOf(y.cat));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seed(){
  const c=[['Poi head','🔥'],['Chain meteor','☄️'],['Contact staff','🪄'],['Rope dart','🪢'],['Charcoal dart cage','🧺'],['Fire fan','🪭']].map(([name,icon])=>({id:uid(),name,price:'',icon,cat:'fire',note:''}));
  return {cards:c,fests:[{id:uid(),name:'First festival',items:{}}],cur:null,tab:'menu'};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||!S.cards)S=seed();
S.cards.forEach(c=>{if(!CATS[c.cat])c.cat='fire';if(c.desc&&!c.note)c.note=c.desc;delete c.desc;if(c.note==='Ask about lead time')c.note='';c.note=c.note||'';c.imgs=Array.isArray(c.imgs)?c.imgs:[]});
S.fests.forEach(f=>{f.info=f.info||'';f.pub=!!f.pub;f.pres=!!f.pres});
S.up=S.up||{};
S.sales=Array.isArray(S.sales)?S.sales:[];S.repairs=Array.isArray(S.repairs)?S.repairs:[];S.repNote=S.repNote||'';S.pm=S.pm||'Cash';
S.contact=S.contact||{name:'Lee Enfuego',phone:'7609759719',email:'Enfuego'+'ball@gmail.com',handle:'@enfuegoballco'};
S.contact.l1=S.contact.l1||'To order please contact';S.contact.l2=S.contact.l2||'We’d love to hear from you';
S.gh=S.gh||{owner:'leenauman48',repo:'PropsMenu2',branch:'main',token:''};
if(!S.cur||!S.fests.find(f=>f.id===S.cur))S.cur=S.fests[0].id;
S.locked=!!(S.locked&&S.pin);
let delArm=false,flt='all',msg='';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fest=()=>S.fests.find(f=>f.id===S.cur);
function payload(){return {updated:new Date().toISOString(),contact:S.contact,repNote:S.repNote,repairs:sortC(S.repairs.map(rres)).map(x=>({name:x.name,icon:x.icon,cat:x.cat,imgs:x.imgs,np:x.np,rp:x.rp,note:x.note})),festivals:S.fests.filter(f=>f.pub).map(f=>({id:f.id,name:f.name,info:f.info,items:sortF(S.cards.filter(c=>f.items[c.id]),f).map(c=>({name:c.name,icon:c.icon,price:c.price,cat:c.cat,tier:f.items[c.id].tier,note:c.note,imgs:c.imgs}))}))}}
const sig=()=>JSON.stringify([payload().festivals,S.contact,payload().repairs,S.repNote]);
const bsig=()=>JSON.stringify([S.cards,S.fests,S.sales,S.repairs,S.repNote]);
const IMG={};
const idb=new Promise((ok,no)=>{try{const q=indexedDB.open('enfuego-img',1);q.onupgradeneeded=()=>q.result.createObjectStore('i',{keyPath:'id'});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}catch(e){no(e)}});idb.catch(()=>{});
const tx=async(m,fn)=>{const d=await idb;return new Promise((ok,no)=>{const t=d.transaction('i',m),r=fn(t.objectStore('i'));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})};
const idbPut=o=>tx('readwrite',s=>s.put(o)),idbGet=id=>tx('readonly',s=>s.get(id)),idbDel=id=>tx('readwrite',s=>s.delete(id));
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const d2b=d=>{const [h,x]=d.split(','),m=/data:(.*?);/.exec(h)[1],bin=atob(x),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})};
function shrink(file,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);cv.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej()},'image/jpeg',q)};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
async function addImgs(cid,files){
  const c=S.cards.find(x=>x.id===cid);if(!c)return;
  let bad=0;
  for(const f of files){try{const id=uid(),t=await shrink(f,420,.78),full=await shrink(f,1100,.8);await idbPut({id,t,f:full});IMG[id]={t:URL.createObjectURL(t),f:URL.createObjectURL(full)};c.imgs.push(id);save();render();}catch(e){bad++}}
  pmErr=bad?bad+(bad>1?' photos':' photo')+' couldn’t be read. If it lives in the cloud, save it to Photos or Files first, then add it again.':'';render();
}
function delImg(id){const m=IMG[id];if(m){URL.revokeObjectURL(m.t);URL.revokeObjectURL(m.f);delete IMG[id];}idbDel(id).catch(()=>{});}
async function loadImgs(){for(const c of S.cards)for(const id of c.imgs){if(IMG[id])continue;try{const r=await idbGet(id);if(r)IMG[id]={t:URL.createObjectURL(r.t),f:URL.createObjectURL(r.f)};}catch(e){}}render();}
function gal(name,price,desc,urls){
  closeGal();const d=document.createElement('div');d.id='gv';d.className='gv';
  d.innerHTML=`<button class="gx" aria-label="Close">✕</button><div class="gs">${urls.map(u=>`<div class="gp"><img src="${esc(u)}" alt=""></div>`).join('')}</div>${urls.length>1?`<div class="gdots">${urls.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}<div class="gcap"><b>${esc(name)}</b>${price!==''&&price!=null?' <span>$'+esc(price)+'</span>':''}${desc?`<p>${esc(desc)}</p>`:''}</div>`;
  document.body.appendChild(d);
  const sc=d.querySelector('.gs'),dots=d.querySelectorAll('.gdots i');
  sc.addEventListener('scroll',()=>{const w=sc.children[0].offsetWidth+12,i=Math.min(urls.length-1,Math.round(sc.scrollLeft/w));dots.forEach((x,k)=>x.classList.toggle('on',k===i))});
  d.addEventListener('click',e=>{if(e.target===d||e.target===sc||e.target.closest('.gx'))closeGal()});
}
function closeGal(){const g=document.getElementById('gv');if(g)g.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGal()});
function openG(id){const c=S.cards.find(x=>x.id===id);if(!c)return;const u=c.imgs.map(i=>IMG[i]&&IMG[i].f).filter(Boolean);if(u.length)gal(c.name,c.price,c.note,u);}
function ccDigits(p){return String(p||'').replace(/\D/g,'')}
function ccPhone(p){const d=ccDigits(p);return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:String(p||'')}
function ccTel(p){const d=ccDigits(p);return d.length===10?'+1'+d:'+'+d}
function ccVcf(c){
  const q=v=>String(v||'').replace(/[\r\n]+/g,' ').replace(/([\\,;])/g,'\\$1'),n=String(c.name||'').trim().split(/\s+/),last=n.length>1?n.pop():'',first=n.join(' ');
  return ['BEGIN:VCARD','VERSION:3.0','FN:'+q(c.name),'N:'+q(last)+';'+q(first)+';;;','ORG:Enfuego Ball Co','TEL;TYPE=CELL:'+ccTel(c.phone),'EMAIL:'+q(c.email),'NOTE:'+q(c.handle),'END:VCARD'].join('\r\n');
}
async function ccJpg(c){
  try{await Promise.all([document.fonts.load("700 90px Caveat"),document.fonts.load("40px 'Patrick Hand'")]);}catch(e){}
  const W=1050,H=600,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const im=await new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ok(null);i.src='logo.png'});
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  g.strokeStyle='#f1efe6';g.lineWidth=5;g.setLineDash([18,10]);g.strokeRect(24,24,W-48,H-48);g.setLineDash([]);
  if(im)g.drawImage(im,48,90,420,420);
  g.fillStyle='#f1efe6';g.font="700 96px Caveat,cursive";g.fillText(c.name||'',500,215);
  g.font="40px 'Patrick Hand',sans-serif";
  g.fillText(ccPhone(c.phone),500,335);g.fillText(c.email||'',500,405);g.fillStyle='#f2c46d';g.fillText(c.handle||'',500,475);
    return new Promise(r=>cv.toBlob(r,'image/jpeg',.92));
}
async function ccSend(file){
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:file.name});return;}}catch(e){if(e&&e.name==='AbortError')return;}

  <div class="bar" style="margin-top:14px"><button data-a="publish" class="${dirty?'on':''}">Publish now</button><span class="hint" style="margin:0">${dirty?'Changes not published yet.':'Everything is published.'}${S.pubAt?' Last: '+esc(S.pubAt):''}</span></div>
  <div class="box"><b>GitHub connection</b><p class="hint">Make a fine-grained token on GitHub limited to this one repository with Contents set to read and write. It stays on this device.</p>
  <label>Owner</label><input type="text" data-a="gh" data-f="owner" value="${esc(g.owner)}"><label>Repository</label><input type="text" data-a="gh" data-f="repo" value="${esc(g.repo)}"><label>Branch</label><input type="text" data-a="gh" data-f="branch" value="${esc(g.branch)}"><label>Token</label><input type="password" data-a="gh" data-f="token" value="${esc(g.token)}" autocomplete="off">
  <div class="bar" style="margin-top:10px"><button data-a="forget">Remove token</button></div></div>`;
}
function vBackup(){
  const dirty=S.bk!==bsig();
  return `<p class="hint">Your cards and festivals live only on this device. A backup is one file you can send to iCloud, Google Drive, Dropbox, email, or a hard drive. It never includes your GitHub token.</p>
  ${msg?`<div class="msg">${esc(msg)}</div>`:''}
  ${bkFile?`<div class="bar"><button data-a="bkshare" class="on">Send backup</button><button data-a="bkdl">Save to Downloads</button></div>`:''}<div class="bar"><button data-a="backup" class="${dirty?'on':''}">Back up now</button><span class="hint" style="margin:0">${dirty?'Changes since your last backup.':'Backed up, nothing new.'}${S.bkAt?' Last: '+esc(S.bkAt):''}</span></div>
  <p class="hint">Tap Back up now, then pick where it goes from the share sheet. Choose Save to Files for iCloud or a plugged-in drive.</p>
  <div class="box"><b>Restore from a backup</b><p class="hint">This replaces everything on this device with the file’s contents. Your current data is kept as a safety copy first.</p>
  <input type="file" id="rfile" accept=".json,application/json" data-a="rfile">
  ${pend?`<div class="msg">Found ${pend.cards.length} cards and ${pend.fests.length} festivals. Replace what’s on this device?</div><div class="bar"><button data-a="rgo" class="on">Replace</button><button data-a="rno">Cancel</button></div>`:''}</div>`;
}
function dl(file){const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
function bkDone(){S.bk=bsig();S.bkAt=new Date().toLocaleString();msg='Backup saved.';bkFile=null;save();render();}
async function backup(){
  msg='Preparing backup…';render();
  const imgs=[];for(const id of new Set(S.cards.flatMap(c=>c.imgs))){try{const r=await idbGet(id);if(r)imgs.push({id,t:await b2d(r.t),f:await b2d(r.f)});}catch(x){}}
  const name='enfuego-backup-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([JSON.stringify({app:'enfuego-menu',v:2,saved:new Date().toISOString(),cards:S.cards,fests:S.fests,cur:S.cur,sales:S.sales,repairs:S.repairs,repNote:S.repNote,imgs},null,1)],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return bkDone();}
    dl(file);return bkDone();
  }catch(err){
    if(err&&err.name==='AbortError'){msg='';return render();}
    bkFile=file;msg='Backup is ready. Tap Send backup to choose where it goes.';render();
  }
}
async function doRestore(){
  try{localStorage.setItem(KEY+'-prev',JSON.stringify({cards:S.cards,fests:S.fests,cur:S.cur}))}catch(x){}
  for(const m of pend.imgs||[]){try{const o={id:m.id,t:d2b(m.t),f:d2b(m.f)};await idbPut(o);if(!IMG[m.id])IMG[m.id]={t:URL.createObjectURL(o.t),f:URL.createObjectURL(o.f)};}catch(x){}}
  S.cards=pend.cards;S.fests=pend.fests;S.cur=pend.cur||'';if(Array.isArray(pend.sales))S.sales=pend.sales;if(Array.isArray(pend.repairs)){S.repairs=pend.repairs;S.repNote=pend.repNote||'';}norm();S.bk=bsig();pend=null;msg='Restored.';save();render();
}
function norm(){S.cards.forEach(c=>{if(!CATS[c.cat])c.cat='fire';if(c.desc&&!c.note)c.note=c.desc;delete c.desc;if(c.note==='Ask about lead time')c.note='';c.note=c.note||'';c.imgs=Array.isArray(c.imgs)?c.imgs:[]});S.fests.forEach(f=>{f.info=f.info||'';f.pub=!!f.pub;f.pres=!!f.pres;f.items=f.items||{}});if(!S.fests.length)S.fests.push({id:uid(),name:'New festival',info:'',pub:false,items:{}});if(!S.fests.find(f=>f.id===S.cur))S.cur=S.fests[0].id;}
async function publish(){
  const g=S.gh;
  if(!g.token||!g.owner||!g.repo){msg='Add your GitHub details below first.';return render();}
  if(!navigator.onLine){msg='No signal. Your changes are saved on this device. Publish when you’re back online.';return render();}
  msg='Publishing…';render();
  const url=`https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/contents/festivals.json`,br=g.branch||'main';
  const H={Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json'};
  try{
    let sha;
    const r=await fetch(url+'?ref='+encodeURIComponent(br),{headers:H});
    if(r.ok)sha=(await r.json()).sha;else if(r.status!==404)throw new Error('GitHub said '+r.status+'. Check the token and repository name.');
    const need=[...new Set([...payload().festivals.flatMap(f=>f.items.flatMap(i=>i.imgs)),...payload().repairs.flatMap(x=>x.imgs)])].filter(id=>!S.up[id]);
    const base=`https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/contents/`;
    let n=0;
    for(const id of need){
      msg=`Uploading photos ${++n} of ${need.length}…`;render();
      const rec=await idbGet(id);if(!rec)continue;
      for(const [path,blob] of [['img/'+id+'-t.jpg',rec.t],['img/'+id+'.jpg',rec.f]]){
        const pr=await fetch(base+path,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:'Add photo',content:(await b2d(blob)).split(',')[1],branch:br})});
        if(!pr.ok&&pr.status!==422)throw new Error('Photo upload failed ('+pr.status+').');
      }
      S.up[id]=1;save();
    }
    const body={message:'Update festivals',content:btoa(unescape(encodeURIComponent(JSON.stringify(payload(),null,1)))),branch:br};
    if(sha)body.sha=sha;
    const w=await fetch(url,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!w.ok)throw new Error('GitHub said '+w.status+'. Check that the token has Contents read and write.');
    S.sig=sig();S.pubAt=new Date().toLocaleString();msg='Published. It goes live in about a minute.';
  }catch(err){msg=err.message||'Publish failed.';}
  save();render();
}
document.addEventListener('click',e=>{
  const cck=e.target.closest('[data-cc]');if(cck&&!cck.closest('#gv')){ccAct(cck.dataset.cc);return;}
  const b=e.target.closest('button[data-a]');
  if(!b){const g=e.target.closest('.card[data-g]');if(g)openG(g.dataset.g);return;}
  const a=b.dataset.a,v=b.dataset.v,f=fest();
  if(S.locked&&!['flt','ukshow','ukgo','ukno','cc','sec'].includes(a))return;
  if(a==='cc')return openCC();
  if(a==='ukshow'){uk=true;ukMsg='';return render();}
  if(a==='ukno'){uk=false;ukMsg='';return render();}
  if(a==='ukgo')return tryUnlock();
  if(a==='setpin')return setPin();
  if(a==='present'){if(!S.pin)return;arr=false;sec='menu';let pl=S.fests.filter(x=>x.pres);if(!pl.length){fest().pres=true;pl=[fest()];}S.pf=(pl.find(x=>x.id===S.cur)||pl[0]).id;S.locked=true;uk=false;flt='all';save();return render();}
  if(a!=='del')delArm=false;
  if(a!=='sdel')sdArm='';
  if(a==='publish')return publish();
  if(a==='backup')return backup();
  if(a==='rno'){pend=null;msg='';return render();}
  if(a==='rgo'&&pend)return doRestore();
  if(a==='bkshare'&&bkFile){navigator.share({files:[bkFile],title:bkFile.name}).then(bkDone).catch(()=>{});return;}
  if(a==='bkdl'&&bkFile){dl(bkFile);bkDone();return;}
  if(a==='tab'){S.tab=v;msg='';}
  else if(a==='flt')flt=v;
  else if(a==='inc'||a==='dec'){const it=f.items[v];if(it)it.qty=Math.max(0,(it.qty||0)+(a==='inc'?1:-1));}
  else if(a==='tog'){if(f.items[v])delete f.items[v];else f.items[v]={tier:'kit',qty:1};}
  else if(a==='tier')f.items[v].tier=b.dataset.k;
  else if(a==='add')S.cards.push({id:uid(),name:'New card',price:'',icon:'🔥',cat:'fire',note:'',imgs:[]});
  else if(a==='sell'){const c=S.cards.find(x=>x.id===v);if(c)S.sales.push({id:uid(),t:Date.now(),fid:f.id,cid:c.id,name:c.name,cat:c.cat,amt:num(c.price),m:S.pm});}
  else if(a==='sother'){const nm=(document.getElementById('onm').value||'').trim()||'Other';S.sales.push({id:uid(),t:Date.now(),fid:f.id,cid:'',name:nm,cat:'',amt:num(document.getElementById('oam').value),m:S.pm});}
  else if(a==='sdel'){if(sdArm===v){S.sales=S.sales.filter(x=>x.id!==v);sdArm='';}else sdArm=v;}
  else if(a==='pmeth')S.pm=v;
  else if(a==='scsv')return salesCsv();
  else if(a==='sec'){sec=v;flt='all';}
  else if(a==='prtog'){const x=S.fests.find(q=>q.id===v);if(x.pres&&S.fests.filter(q=>q.pres).length<2)return;x.pres=!x.pres;}
  else if(a==='radd')S.repairs.push({id:uid(),name:'New repair',icon:'🛠️',cat:'fire',link:'',rp:'',note:''});
  else if(a==='rrm')S.repairs=S.repairs.filter(x=>x.id!==v);
  else if(a==='mvr'){const d=+b.dataset.d,k=S.repairs.findIndex(x=>x.id===v),j=k+d;if(j>=0&&j<S.repairs.length){const t=S.repairs[k];S.repairs[k]=S.repairs[j];S.repairs[j]=t;}}
  else if(a==='arr')arr=!arr;
  else if(a==='mvf'){const d=+b.dataset.d,all=sortF(S.cards.filter(c=>f.items[c.id]),f),c=S.cards.find(x=>x.id===v),same=all.filter(x=>x.cat===c.cat),k=same.indexOf(c),j=k+d;if(j>=0&&j<same.length){[same[k],same[j]]=[same[j],same[k]];f.ord=ORD.flatMap(cat=>cat===c.cat?same:all.filter(x=>x.cat===cat)).map(x=>x.id);}}
  else if(a==='mvc'){const d=+b.dataset.d,k=S.cards.findIndex(c=>c.id===v),j=k+d;if(j>=0&&j<S.cards.length){const t=S.cards[k];S.cards[k]=S.cards[j];S.cards[j]=t;}}
  else if(a==='pm'){pmId=v;pmErr='';}
  else if(a==='pmx'){pmId=null;pmErr='';}
  else if(a==='imgrm'){const c=S.cards.find(x=>x.id===v),id=b.dataset.k;c.imgs=c.imgs.filter(x=>x!==id);delImg(id);}
  else if(a==='imgcover'){const c=S.cards.find(x=>x.id===v),id=b.dataset.k;c.imgs=[id,...c.imgs.filter(x=>x!==id)];}
  else if(a==='rm'){const dc=S.cards.find(c=>c.id===v);if(dc)dc.imgs.forEach(delImg);S.cards=S.cards.filter(c=>c.id!==v);S.fests.forEach(x=>delete x.items[v]);}
  else if(a==='dup'||a==='blank'){const n={id:uid(),name:a==='dup'?f.name+' copy':'New festival',info:'',pub:false,items:a==='dup'?JSON.parse(JSON.stringify(f.items)):{}};S.fests.push(n);S.cur=n.id;}
  else if(a==='del'){if(!delArm)delArm=true;else{delArm=false;S.fests=S.fests.filter(x=>x.id!==f.id);if(!S.fests.length)S.fests.push({id:uid(),name:'New festival',info:'',pub:false,items:{}});S.cur=S.fests[0].id;}}
  else if(a==='pubtog'){const x=S.fests.find(q=>q.id===v);x.pub=!x.pub;}
  else if(a==='forget'){S.gh.token='';msg='Token removed from this device.';}
  save();render();
});
document.addEventListener('change',e=>{
  if(S.locked&&e.target.dataset.a!=='pfest')return;
  const t=e.target,a=t.dataset.a;
  if(a==='fest'){S.cur=t.value;delArm=false;save();render();}
  else if(a==='samt'||a==='smeth'){const x=S.sales.find(q=>q.id===t.dataset.v);if(x){if(a==='samt')x.amt=num(t.value);else x.m=t.value;save();render();}}
  else if(a==='pfest'){S.pf=t.value;flt='all';save();render();}
  else if(a==='rnote'){S.repNote=t.value;save();}
  else if(a==='redit'){const x=S.repairs.find(q=>q.id===t.dataset.v);if(x){x[t.dataset.f]=t.value;save();if(t.dataset.f==='cat')render();}}
  else if(a==='rlink'){const x=S.repairs.find(q=>q.id===t.dataset.v),c=S.cards.find(q=>q.id===t.value);if(x){x.link=c?c.id:'';if(c){x.name=c.name;x.icon=c.icon;x.cat=c.cat;}save();render();}}
  else if(a==='ct'){S.contact[t.dataset.f]=t.value.trim();save();}
  else if(a==='imgadd'){addImgs(t.dataset.v,[...t.files]);t.value='';}
  else if(a==='edit'){const c=S.cards.find(x=>x.id===t.dataset.v);if(c){c[t.dataset.f]=t.value;save();if(t.dataset.f==='cat')render();}}
  else if(a==='rfile'){const fl=t.files&&t.files[0];if(!fl)return;fl.text().then(x=>{try{const d=JSON.parse(x);if(d.app!=='enfuego-menu'||!Array.isArray(d.cards)||!Array.isArray(d.fests))throw 0;pend=d;msg='';}catch(err){pend=null;msg='That file isn’t an Enfuego backup.';}render();});}
  else if(a==='gh'){S.gh[t.dataset.f]=t.value.trim();save();}
  else if(t.id==='fname'){fest().name=t.value||'Untitled';save();render();}
  else if(t.id==='finfo'){fest().info=t.value;save();}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ukpin')tryUnlock()});
render();loadImgs();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}})}
</script>
