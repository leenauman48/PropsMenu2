<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>Enfuego Ball Co</title>
<meta name="theme-color" content="#23282a">
<style>
@font-face{font-family:'Caveat';font-weight:700;src:url(caveat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Patrick Hand';font-weight:400;src:url(patrick-hand-latin-400-normal.woff2) format('woff2')}
:root{--board:#23282a;--board2:#2c3234;--chalk:#f1efe6;--dim:#a9aca5;--fire:#e8756d;--life:#8fd694;--acc:#6fb3e8;--kit:#f2c46d;--home:#f1efe6;--order:#d3a8f0;--hand:'Caveat','Segoe Print','Bradley Hand',cursive;--body:'Patrick Hand','Comic Sans MS',sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--board);color:var(--chalk);font-family:var(--body);font-size:18px}
body{min-height:100vh;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:6px 6px}
header{padding:14px;border-bottom:2px dashed #555b5c}
h1{font-family:var(--hand);font-size:38px;margin:0;font-weight:700}
.info{color:var(--dim);margin:4px 0 0}
main{padding:14px;max-width:1100px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:2px solid var(--c,var(--chalk));border-radius:10px 14px 9px 13px;padding:4px 12px;cursor:pointer}
button:focus-visible{outline:3px solid var(--kit);outline-offset:2px}
button.on{background:var(--c,var(--chalk));color:var(--board)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0}
.cat-fire{--c:var(--fire)}.cat-life{--c:var(--life)}.cat-acc{--c:var(--acc)}
.t-kit{--tc:var(--kit)}.t-home{--tc:var(--home)}.t-order{--tc:var(--order)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;padding-top:16px}
.card{position:relative;border:3px solid var(--c);border-radius:14px 10px 16px 9px;padding:10px 8px 12px;text-align:center;background:var(--board2);min-height:180px;display:flex;flex-direction:column;align-items:center;gap:2px;transform:rotate(var(--r,0deg))}
.card::before{content:"";position:absolute;top:-14px;left:50%;width:2px;height:14px;background:var(--dim)}
.ic{font-size:44px;line-height:1.1}
.nm{font-family:var(--hand);font-size:29px;font-weight:700;line-height:1;margin-top:2px}
.pr{font-size:22px;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:2px 10px;line-height:1.1}
.pr .tw{font-size:19px;font-weight:700;color:var(--tc)}
.tag{font-size:16px;color:var(--dim);margin-top:6px}
.gh{grid-column:1/-1;font-family:var(--hand);font-size:28px;font-weight:700;color:var(--c);margin:8px 0 -6px;border-bottom:2px dashed var(--c);line-height:1.1}
.ds{font-size:16px;color:var(--dim);line-height:1.2;margin-top:4px}
.ph{width:92px;height:92px;object-fit:cover;border-radius:10px;border:2px solid var(--dim);background:var(--board)}
.gd{display:flex;gap:4px;justify-content:center;margin:3px 0 0}.gd i{width:5px;height:5px;border-radius:50%;background:var(--chalk);opacity:.35}.gd i:first-child{opacity:.85}
.card[data-g]{cursor:pointer}
.gv{position:fixed;inset:0;z-index:50;background:rgba(14,17,18,.94);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.gx{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;background:var(--board)}
.gs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;padding:0 7%;scroll-padding:0 7%;scrollbar-width:none}.gs::-webkit-scrollbar{display:none}
.gp{flex:0 0 86%;scroll-snap-align:center}.gp img{width:100%;max-height:64vh;object-fit:contain;border-radius:12px;display:block}
.gdots{display:flex;gap:8px}.gdots i{width:8px;height:8px;border-radius:50%;background:var(--chalk);opacity:.3}.gdots i.on{opacity:.9}
.gcap{max-width:520px;text-align:center;padding:0 16px;font-size:20px}.gcap b{font-family:var(--hand);font-size:30px}.gcap p{color:var(--dim);margin:4px 0 0;font-size:17px}
.bc{border:3px dashed var(--chalk);border-radius:16px 12px 18px 11px;background:var(--board2);padding:22px 26px;width:min(86vw,420px);display:flex;flex-direction:column;gap:6px;font-size:22px}
.bc .bn{font-family:var(--hand);font-size:44px;font-weight:700;line-height:1}.bc .bb{font-family:var(--hand);font-size:30px;font-weight:700;color:var(--kit);margin-bottom:6px}.bc a{color:var(--chalk);text-decoration:none}
.empty{padding:30px 0;color:var(--dim);font-size:20px}
</style>
</head>
<body>
<script>
try{if((navigator.standalone||matchMedia('(display-mode: standalone)').matches)&&localStorage.getItem('enfuego-menu-v1'))location.replace('admin.html')}catch(e){}
</script>
<header style="display:flex;gap:10px;justify-content:space-between;align-items:flex-start"><div><h1>Enfuego Ball Co</h1><p class="info" id="info"></p></div><button id="ccb" class="on" style="--c:var(--chalk)">Order / Contact</button></header>
<main id="app"><div class="empty">Loading the menu…</div></main>
<script>
const TIERS={kit:'Available Today',home:'Ready To Ship',order:'Made To Order'};
const CATS={fire:'Fire props',acc:'Accessories',life:'Lifestyle'};
const ORD=['fire','acc','life'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,fid='',flt='all',LIST=[];
function gal(name,price,desc,urls){
  closeGal();const d=document.createElement('div');d.id='gv';d.className='gv';
  d.innerHTML=`<button class="gx" aria-label="Close">✕</button><div class="gs">${urls.map(u=>`<div class="gp"><img src="${esc(u)}" alt=""></div>`).join('')}</div>${urls.length>1?`<div class="gdots">${urls.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}<div class="gcap"><b>${esc(name)}</b>${price!==''&&price!=null?' <span>$'+esc(price)+'</span>':''}${desc?`<p>${esc(desc)}</p>`:''}</div>`;
  document.body.appendChild(d);
  const sc=d.querySelector('.gs'),dots=d.querySelectorAll('.gdots i');
  sc.addEventListener('scroll',()=>{const w=sc.children[0].offsetWidth+12,i=Math.min(urls.length-1,Math.round(sc.scrollLeft/w));dots.forEach((x,k)=>x.classList.toggle('on',k===i))});
  d.addEventListener('click',e=>{if(e.target===d||e.target===sc||e.target.closest('.gx'))closeGal()});
}
function closeGal(){const g=document.getElementById('gv');if(g)g.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGal()});
function ccDigits(p){return String(p||'').replace(/\D/g,'')}
function ccPhone(p){const d=ccDigits(p);return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:String(p||'')}
function ccTel(p){const d=ccDigits(p);return d.length===10?'+1'+d:'+'+d}
function ccVcf(c){
  const q=v=>String(v||'').replace(/[\r\n]+/g,' ').replace(/([\\,;])/g,'\\$1'),n=String(c.name||'').trim().split(/\s+/),last=n.length>1?n.pop():'',first=n.join(' ');
  return ['BEGIN:VCARD','VERSION:3.0','FN:'+q(c.name),'N:'+q(last)+';'+q(first)+';;;','ORG:Enfuego Ball Co','TEL;TYPE=CELL:'+ccTel(c.phone),'EMAIL:'+q(c.email),'NOTE:'+q(c.handle),'END:VCARD'].join('\r\n');
}
async function ccJpg(c){
  try{await Promise.all([document.fonts.load("700 90px Caveat"),document.fonts.load("40px 'Patrick Hand'")]);}catch(e){}
  const W=1050,H=600,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  g.fillStyle='#23282a';g.fillRect(0,0,W,H);
  g.strokeStyle='#f1efe6';g.lineWidth=5;g.setLineDash([18,10]);g.strokeRect(24,24,W-48,H-48);g.setLineDash([]);
  const poly=(pts,col)=>{g.fillStyle=col;g.beginPath();pts.forEach(([x,y],i)=>{const X=60+(x-112)*.95,Y=100+(y-70)*.95;i?g.lineTo(X,Y):g.moveTo(X,Y)});g.closePath();g.fill()};
  poly([[256,70],[350,200],[400,300],[370,400],[300,450],[212,450],[142,400],[112,300],[165,215],[200,260],[215,170]],'#f2c46d');
  poly([[256,200],[320,290],[335,370],[295,420],[217,420],[177,370],[192,300],[230,310]],'#e58fb0');
  poly([[256,300],[295,355],[280,410],[232,410],[217,355]],'#f1efe6');
  g.fillStyle='#f1efe6';g.font="700 100px Caveat,cursive";g.fillText(c.name||'',390,205);
  g.fillStyle='#f2c46d';g.font="700 56px Caveat,cursive";g.fillText('Enfuego Ball Co',390,275);
  g.fillStyle='#f1efe6';g.font="40px 'Patrick Hand',sans-serif";
  g.fillText(ccPhone(c.phone),390,375);g.fillText(c.email||'',390,440);g.fillText(c.handle||'',390,505);
  return new Promise(r=>cv.toBlob(r,'image/jpeg',.92));
}
async function ccSend(file){
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:file.name});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function openCC(){
  closeGal();const c=getContact(),d=document.createElement('div');d.id='gv';d.className='gv';
  d.innerHTML=`<button class="gx" aria-label="Close">✕</button><div class="bc"><div class="bn">${esc(c.name)}</div><div class="bb">Enfuego Ball Co</div><a href="tel:${esc(ccTel(c.phone))}">${esc(ccPhone(c.phone))}</a><a href="mailto:${esc(c.email)}">${esc(c.email)}</a><span>${esc(c.handle)}</span></div><div class="bar" style="justify-content:center"><button data-cc="jpg" class="on">Save as JPEG</button><button data-cc="vcf">Add to Contacts</button></div>`;
  document.body.appendChild(d);
  const jp=ccJpg(c);jp.catch(()=>{});
  d.addEventListener('click',async e=>{
    const k=e.target.closest('[data-cc]');
    if(k){try{if(k.dataset.cc==='jpg')ccSend(new File([await jp],'enfuego-contact.jpg',{type:'image/jpeg'}));else ccSend(new File([ccVcf(c)],'Enfuego-Contact.vcf',{type:'text/vcard'}));}catch(x){}return;}
    if(e.target===d||e.target.closest('.gx'))closeGal();
  });
}

const DEFC={name:'Lee Enfuego',phone:'7609759719',email:'Enfuego'+'ball@gmail.com',handle:'@enfuegoballco'};
function getContact(){const c=(D&&D.contact)||{};return {name:c.name||DEFC.name,phone:c.phone||DEFC.phone,email:c.email||DEFC.email,handle:c.handle||DEFC.handle}}
const pids=c=>(c.imgs||[]).filter(x=>/^[a-z0-9]+$/.test(x));
function render(){
  const el=document.getElementById('app'),inf=document.getElementById('info');
  if(D===null){el.innerHTML='<div class="empty">Can’t load the menu right now. Check your connection and try again.</div>';return;}
  const fs=D.festivals||[];
  if(!fs.length){el.innerHTML='<div class="empty">No menus are posted right now. Check back soon.</div>';inf.textContent='';return;}
  const f=fs.find(x=>x.id===fid)||fs[0];
  inf.textContent=f.info||'';
  let h='';
  if(fs.length>1)h+=`<div class="chips">${fs.map(x=>`<button data-f="${esc(x.id)}" class="${x.id===f.id?'on':''}">${esc(x.name)}</button>`).join('')}</div>`;
  else h+=`<h2 style="font-family:var(--hand);font-size:30px;margin:0">${esc(f.name)}</h2>`;
  h+=`<div class="chips"><button data-c="all" class="${flt==='all'?'on':''}">All</button>${Object.entries(CATS).map(([k,l])=>`<button data-c="${k}" class="cat-${k} ${flt===k?'on':''}">${l}</button>`).join('')}</div>`;
  const items=(f.items||[]).map(c=>({...c,cat:CATS[c.cat]?c.cat:'fire'})).filter(c=>flt==='all'||c.cat===flt).sort((x,y)=>ORD.indexOf(x.cat)-ORD.indexOf(y.cat));let last='';LIST=items;
  if(!items.length)h+='<div class="empty">Nothing in this group.</div>';
  else h+='<div class="grid">'+items.map((c,i)=>{
    const cat=c.cat,gh=(flt==='all'&&cat!==last)?(last=cat,`<h3 class="gh cat-${cat}">${CATS[cat]}</h3>`):'',t=TIERS[c.tier]?c.tier:'order',r=((i*37)%5-2)*.5;
    const ids=pids(c),pic=ids.length?`<img class="ph" loading="lazy" src="img/${ids[0]}-t.jpg" alt="">${ids.length>1?`<div class="gd">${ids.map(()=>'<i></i>').join('')}</div>`:''}`:`<div class="ic">${esc(c.icon)}</div>`;
    return gh+`<div class="card cat-${cat} t-${t}" ${ids.length?`data-g="${i}"`:''} style="--r:${r}deg">${pic}<div class="nm">${esc(c.name)}</div><div class="pr">${c.price!==''&&c.price!=null?'<b>$'+esc(c.price)+'</b>':''}<span class="tw">${TIERS[t]}</span></div>${c.note?`<div class="ds">${esc(c.note)}</div>`:''}</div>`;
  }).join('')+'</div>';
  el.innerHTML=h;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b){const g=e.target.closest('.card[data-g]');if(g){const c=LIST[+g.dataset.g];if(c)gal(c.name,c.price,c.note,pids(c).map(id=>'img/'+id+'.jpg'));}return;}
  if(b.closest('#gv')||b.id==='ccb')return;
  if(b.dataset.f){fid=b.dataset.f;try{history.replaceState(null,'','#'+fid)}catch(x){}}
  if(b.dataset.c)flt=b.dataset.c;
  render();
});
document.getElementById('ccb').addEventListener('click',openCC);
fid=decodeURIComponent(location.hash.slice(1));
fetch('festivals.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{festivals:[]}).then(j=>{D=j;render()}).catch(()=>{D=null;render()});
</script>
</body>
</html>
