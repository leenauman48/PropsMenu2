<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enfuego menu board</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Enfuego"><meta name="theme-color" content="#23282a">
<style>
@font-face{font-family:'Caveat';font-weight:700;src:url(caveat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Patrick Hand';font-weight:400;src:url(patrick-hand-latin-400-normal.woff2) format('woff2')}
:root{--board:#23282a;--board2:#2c3234;--chalk:#f1efe6;--dim:#a9aca5;--kit:#8fd694;--home:#f2c46d;--order:#e58fb0;--hand:'Caveat','Segoe Print','Bradley Hand',cursive;--body:'Patrick Hand','Comic Sans MS',sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--board);color:var(--chalk);font-family:var(--body);font-size:18px}
body{min-height:100vh;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:6px 6px}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:2px dashed #555b5c}
h1{font-family:var(--hand);font-size:34px;margin:0;font-weight:700;flex:1;min-width:160px}
nav{display:flex;gap:6px}
button,input,select{font:inherit;color:inherit}
button{background:none;border:2px solid var(--chalk);border-radius:10px 14px 9px 13px;padding:4px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--home);outline-offset:2px}
nav button.on{background:var(--chalk);color:var(--board)}
main{padding:14px;max-width:1100px;margin:0 auto}
select,input[type=text]{background:var(--board2);border:2px solid #555b5c;border-radius:8px;padding:5px 9px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;padding-top:6px}
.card{position:relative;font-weight:400;border:3px solid var(--c);border-radius:14px 10px 16px 9px;padding:10px 8px 8px;text-align:center;background:var(--board2);min-height:210px;display:flex;flex-direction:column;align-items:center;gap:2px;transform:rotate(var(--r,0deg))}
.card::before{content:"";position:absolute;top:-14px;left:50%;width:2px;height:14px;background:var(--dim)}
.t-kit{--c:var(--kit)}.t-home{--c:var(--home)}.t-order{--c:var(--order)}
.ic{font-size:44px;line-height:1.1}
.nm{font-family:var(--hand);font-size:29px;font-weight:700;line-height:1;margin-top:2px}
.pr{font-size:22px;color:var(--c);display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:2px 10px;line-height:1.1}.pr .tw{font-size:19px;font-weight:700}
.dots{margin-top:auto;font-size:17px;letter-spacing:2px;color:var(--c);min-height:26px;word-break:break-all}
.tag{font-size:15px;color:var(--c);margin-top:auto;min-height:26px}
.ctl{display:flex;gap:12px;align-items:center;margin-top:4px}
.ctl button{width:36px;height:30px;padding:0;font-size:20px}
.stamp{position:absolute;inset:auto 6px 46px 6px;font-family:var(--hand);font-size:30px;font-weight:700;color:#e8756d;border:3px solid #e8756d;border-radius:8px;transform:rotate(-9deg);background:rgba(35,40,42,.9);padding:0 4px}
.sold{opacity:.55}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:16px;padding:4px 0 10px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);margin-right:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px dashed #4a5051;padding:10px 0}
.row .nm2{font-family:var(--hand);font-size:26px;font-weight:700;min-width:130px;flex:1}
.seg{display:flex}.seg button{border-radius:0;margin-left:-2px;padding:3px 9px;font-size:15px}.seg button:first-child{border-radius:10px 0 0 10px;margin-left:0}.seg button:last-child{border-radius:0 10px 10px 0}
.seg button.on{background:var(--c);color:var(--board);border-color:var(--c)}
.inc{width:34px;height:34px;padding:0;font-size:20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.hint{color:var(--dim);font-size:16px;margin:6px 0 12px}
.lib input.n{width:150px}.lib input.p{width:70px}.lib input.e{width:56px;text-align:center}.lib input.o{flex:1;min-width:140px}
.empty{padding:30px 0;color:var(--dim);font-size:20px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}}
</style>
</head>
<body>
<header><h1>Enfuego Ball Co</h1><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const KEY='enfuego-menu-v1';
const TIERS={kit:'Available Today',home:'Ready To Ship',order:'Made To Order'};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seed(){
  const c=[['Poi head','🔥'],['Chain meteor','☄️'],['Contact staff','🪄'],['Rope dart','🪢'],['Charcoal dart cage','🧺'],['Fire fan','🪭']].map(([name,icon])=>({id:uid(),name,price:'',icon,note:'Ask about lead time'}));
  return {cards:c,fests:[{id:uid(),name:'First festival',items:{}}],cur:null,tab:'menu'};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||!S.cards)S=seed();
if(!S.cur||!S.fests.find(f=>f.id===S.cur))S.cur=S.fests[0].id;
let delArm=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fest=()=>S.fests.find(f=>f.id===S.cur);

function render(){
  document.getElementById('nav').innerHTML=[['menu','Menu'],['load','Load'],['cards','Cards']].map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('');
  const el=document.getElementById('app');
  el.innerHTML=S.tab==='menu'?vMenu():S.tab==='load'?vLoad():vCards();
}
function festPicker(){
  return `<select data-a="fest" aria-label="Festival">${S.fests.map(f=>`<option value="${f.id}" ${f.id===S.cur?'selected':''}>${esc(f.name)}</option>`).join('')}</select>`;
}
function vMenu(){
  const f=fest();
  const ids=S.cards.filter(c=>f.items[c.id]);
  let h=`<div class="bar">${festPicker()}</div>`;
  if(!ids.length)return h+`<div class="empty">Nothing loaded for this festival yet. Open Load and pick your cards.</div>`;
  h+='<div class="grid">'+ids.map((c,i)=>{
    const it=f.items[c.id],t=it.tier,q=it.qty||0,r=((i*37)%5-2)*.5;
    let low='';
    if(t==='order')low=`<div class="tag">${esc(c.note||'Ask me')}</div>`;
    else low=`<div class="dots">${q<=0?'':q<=12?'●'.repeat(q):'● × '+q}</div><div class="ctl"><button data-a="dec" data-v="${c.id}" aria-label="Sold one">−</button><span>${q}</span><button data-a="inc" data-v="${c.id}" aria-label="Add one">+</button></div>`;
    return `<div class="card t-${t} ${t!=='order'&&q<=0?'sold':''}" style="--r:${r}deg"><div class="ic">${esc(c.icon)}</div><div class="nm">${esc(c.name)}</div><div class="pr">${c.price!==''?'<b>$'+esc(c.price)+'</b>':''}<span class="tw">${TIERS[t]}</span></div>${low}${t!=='order'&&q<=0?'<div class="stamp">Sold out</div>':''}</div>`;
  }).join('')+'</div>';
  return h;
}
function vLoad(){
  const f=fest();
  let h=`<div class="bar">${festPicker()}<input type="text" id="fname" value="${esc(f.name)}" aria-label="Festival name"><button data-a="dup">Copy as new</button><button data-a="blank">New blank</button><button data-a="del">${delArm?'Tap again to delete':'Delete'}</button></div><p class="hint">Pick which cards go on this festival’s board, where each one is, and how many.</p>`;
  h+=S.cards.map(c=>{
    const it=f.items[c.id];
    let x=`<button data-a="tog" data-v="${c.id}" class="${it?'on':''}" style="${it?'background:var(--chalk);color:var(--board)':''}">${it?'On board':'Add'}</button>`;
    if(it)x+=`<div class="seg">${Object.entries(TIERS).map(([k,l])=>`<button data-a="tier" data-v="${c.id}" data-k="${k}" style="--c:var(--${k})" class="${it.tier===k?'on':''}">${l}</button>`).join('')}</div>`+(it.tier!=='order'?`<button class="inc" data-a="dec" data-v="${c.id}">−</button><b>${it.qty||0}</b><button class="inc" data-a="inc" data-v="${c.id}">+</button>`:'');
    return `<div class="row"><span class="nm2">${esc(c.icon)} ${esc(c.name)}</span>${x}</div>`;
  }).join('');
  return h;
}
function vCards(){
  return `<p class="hint">Your full card library. Make a card once, then load it onto any festival.</p>`+S.cards.map(c=>`<div class="row lib"><input class="e" type="text" data-a="edit" data-f="icon" data-v="${c.id}" value="${esc(c.icon)}" aria-label="Icon"><input class="n" type="text" data-a="edit" data-f="name" data-v="${c.id}" value="${esc(c.name)}" aria-label="Name"><input class="p" type="text" inputmode="decimal" placeholder="$" data-a="edit" data-f="price" data-v="${c.id}" value="${esc(c.price)}" aria-label="Price"><input class="o" type="text" placeholder="Lead-time note" data-a="edit" data-f="note" data-v="${c.id}" value="${esc(c.note)}" aria-label="Lead-time note"><button data-a="rm" data-v="${c.id}" aria-label="Delete card">✕</button></div>`).join('')+`<div class="row"><button data-a="add">+ New card</button></div>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v,f=fest();
  if(a!=='del')delArm=false;
  if(a==='tab')S.tab=v;
  else if(a==='inc'||a==='dec'){const it=f.items[v];if(it)it.qty=Math.max(0,(it.qty||0)+(a==='inc'?1:-1));}
  else if(a==='tog'){if(f.items[v])delete f.items[v];else f.items[v]={tier:'kit',qty:1};}
  else if(a==='tier'){f.items[v].tier=b.dataset.k;}
  else if(a==='add'){S.cards.push({id:uid(),name:'New card',price:'',icon:'🔥',note:''});}
  else if(a==='rm'){S.cards=S.cards.filter(c=>c.id!==v);S.fests.forEach(x=>delete x.items[v]);}
  else if(a==='dup'||a==='blank'){const n={id:uid(),name:a==='dup'?f.name+' copy':'New festival',items:a==='dup'?JSON.parse(JSON.stringify(f.items)):{}};S.fests.push(n);S.cur=n.id;}
  else if(a==='del'){if(!delArm){delArm=true;}else{delArm=false;S.fests=S.fests.filter(x=>x.id!==f.id);if(!S.fests.length)S.fests.push({id:uid(),name:'New festival',items:{}});S.cur=S.fests[0].id;}}
  save();render();
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.a;
  if(a==='fest'){S.cur=t.value;delArm=false;save();render();}
  else if(a==='edit'){const c=S.cards.find(x=>x.id===t.dataset.v);if(c){c[t.dataset.f]=t.value;save();}}
  else if(t.id==='fname'){fest().name=t.value||'Untitled';save();render();}
});
render();
if('serviceWorker' in navigator){addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}})}
</script>
</body>
</html>
